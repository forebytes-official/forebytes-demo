<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="See this dish in augmented reality — place it on your table at real scale.">
  <meta name="theme-color" content="#1C0A00">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta property="og:site_name" content="Forebytes AR">
  <meta property="og:title" content="Anu's Kitchen — AR View">
  <meta property="og:description" content="See this dish at real scale on your table before you order.">
  <meta property="og:type" content="website">
  <title>Anu's Kitchen — AR View</title>
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="viewer.css">
</head>
<body>

  <header>
    <a class="back-btn" href="menu/" aria-label="Back to menu">
      <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M19 12H5M5 12l7 7M5 12l7-7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      Menu
    </a>
    <span class="header-dish-name" id="headerDishName"></span>
    <span class="header-ar-label">AR</span>
  </header>

  <model-viewer
    id="viewer"
    ar
    ar-modes="quick-look scene-viewer webxr"
    camera-controls
    auto-rotate
    auto-rotate-delay="1000"
    rotation-per-second="20deg"
    shadow-intensity="1"
    exposure="1"
  >
    <div class="poster-slot" slot="poster">
      <svg width="48" height="48" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M12 2L3 7v10l9 5 9-5V7L12 2z" stroke="#0EA5E9" stroke-width="1.5" stroke-linejoin="round"/>
        <path d="M12 2v15M3 7l9 5 9-5" stroke="#0EA5E9" stroke-width="1.5" stroke-linejoin="round"/>
      </svg>
    </div>
  </model-viewer>

  <div class="controls">
    <p class="controls-dish-name" id="controlsDishName"></p>
    <p class="controls-hint">Rotate · Pinch to zoom</p>
    <p class="ar-unsupported" id="arUnsupported">AR requires Safari on iPhone or Chrome on Android.</p>
    <button class="btn-ar" id="arBtn" aria-label="View dish in augmented reality">
      <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <rect x="2" y="3" width="8" height="8" rx="1" stroke="#fff" stroke-width="1.8"/>
        <rect x="14" y="3" width="8" height="8" rx="1" stroke="#fff" stroke-width="1.8"/>
        <rect x="2" y="13" width="8" height="8" rx="1" stroke="#fff" stroke-width="1.8"/>
        <rect x="14" y="13" width="8" height="8" rx="1" stroke="#fff" stroke-width="1.8"/>
      </svg>
      View on Your Table
    </button>
  </div>

  <div class="error-screen" id="errorScreen">
    <svg width="52" height="52" viewBox="0 0 24 24" fill="none" aria-hidden="true">
      <path d="M12 2L3 7v10l9 5 9-5V7L12 2z" stroke="#C8860A" stroke-width="1.5" stroke-linejoin="round"/>
      <path d="M12 2v15M3 7l9 5 9-5" stroke="#C8860A" stroke-width="1.5" stroke-linejoin="round"/>
    </svg>
    <h2>Model not ready yet</h2>
    <p>The 3D model for this dish is still being prepared. Check back soon!</p>
    <a href="menu/">← Back to menu</a>
  </div>

  <script src="viewer.js" defer></script>

</body>
</html>
